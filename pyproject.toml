[project]
name = "swiss-market-research-llm"
version = "0.1.0"
description = "Persona-based LLM querying system for Swiss market research"
authors = ["Swiss Market Research Agency"]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "asyncio",
    "json",
    "random",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "typing-extensions>=4.8.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
